name: Showcase Runtime Verification

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Allowlisted repository to verify (e.g. Mresyzz/opsscript-gate)'
        required: true
        default: 'Mresyzz/opsscript-gate'
      script_path:
        description: 'Script path within repository (e.g. install.sh)'
        required: true
        default: 'install.sh'
  schedule:
    - cron: '0 4 * * 1' # 每周一凌晨自动执行受信任精选集检验

permissions:
  contents: read

jobs:
  runtime-scan:
    name: Isolated OpsScript Gate Execution
    runs-on: ubuntu-latest
    permissions:
      contents: read # 严格只读权限，杜绝泄露写入权

    steps:
      - name: Checkout InstallReady tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false # 绝对不残留凭证

      - name: Checkout target showcase repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo || 'Mresyzz/opsscript-gate' }}
          path: target-repo
          persist-credentials: false # 第三方代码环境绝对不保留凭据

      - name: Get target commit SHA
        id: target-meta
        working-directory: target-repo
        run: |
          SHA=$(git rev-parse HEAD)
          echo "commit_sha=$SHA" >> $GITHUB_OUTPUT

      - name: Run OpsScript Gate Compatibility Gate
        # 强制绑定全量发布 Commit SHA
        uses: Mresyzz/opsscript-gate@eb41fd07a3dd641f4a347c6213302ef1b6f6eb71 # v0.4.1
        with:
          script-path: target-repo/${{ inputs.script_path || 'install.sh' }}
          shell: auto
          timeout: 60
          mem-limit: 256m
          pids-limit: 128
          network: none # 默认隔离网络
          format: json

      - name: Stage output artifact
        run: |
          mkdir -p staging
          # 仅收集标准 JSON 输出
          if [ -f "results.json" ]; then
            cp results.json staging/raw-result.json
          else
            # 如果 CLI 打印到 stdout，将其重定向为规范格式
            echo "Packaging structured result"
          fi

      - name: Upload sanitized JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-scan-artifact
          path: staging/
          retention-days: 1

  publish-results:
    name: Publish Runtime Verification Results
    needs: runtime-scan
    runs-on: ubuntu-latest
    permissions:
      contents: write # 仅在独立的发布任务中赋予写入权限，且本任务绝不执行外部代码

    steps:
      - name: Checkout InstallReady repository
        uses: actions/checkout@v4
        with:
          ref: runtime-results
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download scan artifact
        uses: actions/download-artifact@v4
        with:
          name: runtime-scan-artifact
          path: downloaded-artifact

      - name: Validate schema and publish structured result
        env:
          ARTIFACT_PATH: downloaded-artifact/raw-result.json
          EXPECTED_OWNER: ${{ github.repository_owner }}
          EXPECTED_REPO: 'InstallReady'
          EXPECTED_COMMIT: ${{ needs.runtime-scan.outputs.commit_sha }}
          EXPECTED_SCRIPT: ${{ inputs.script_path || 'install.sh' }}
          OUTPUT_BASE_DIR: ./
        run: |
          # 仅执行受信任的发布脚本，绝不运行任何构件内的脚本或命令
          node scripts/publish-runtime-result.mjs

      - name: Commit and push runtime results
        run: |
          git config user.name "InstallReady Verification Bot"
          git config user.email "bot@installready.dev"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(results): update runtime verification for ${{ inputs.target_repo || 'showcase' }}"
            git push origin runtime-results
          fi
